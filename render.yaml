# Render Blueprint for the Kestrel Bay API (BUILD_PROMPT §15, ADR-002).
# Render → New → Blueprint → pick this repo. Render reads this file and creates the service.
# Secrets marked `sync: false` are typed into Render's dashboard and never committed.
services:
  - type: web
    name: kestrel-bay-api
    runtime: python
    plan: free # sleeps after ~15 min idle; the UI shows a "waking up" note (§9.4)
    region: virginia # same AWS region as the Supabase database (us-east-1), so queries stay local
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true # every push to main redeploys
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL # Supabase → Connect → Session pooler string
        sync: false
      - key: CORS_ORIGINS # the Vercel URL, comma-separated if more than one
        sync: false
      - key: AS_OF_DATE
        value: "2026-11-16"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ENV
        value: production
