# ruff lint + format settings (BUILD_PROMPT §12). Kept out of pyproject.toml; see pytest.ini for why.
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]  # autogenerated, reviewed by hand

[lint]
# E/F: errors · I: import order · UP: modern syntax · B: likely bugs · SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` in default arguments is the documented pattern
]

[lint.per-file-ignores]
"tests/**" = ["E501"]  # long literal expectations in tests are fine
