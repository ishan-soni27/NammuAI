# pytest settings. (Not in pyproject.toml on purpose: Vercel treats any backend/pyproject.toml
# as THE dependency list and would then ignore requirements.txt. See tests/unit/test_deploy_config.py.)
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    db: needs a real Postgres database (DATABASE_URL_TEST); skipped when it isn't set
