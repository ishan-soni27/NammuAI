# Tool configuration only (pytest, ruff). Dependencies live in requirements*.txt so Render's
# plain `pip install -r requirements.txt` works without a build step.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a real Postgres database (DATABASE_URL_TEST); skipped when it isn't set",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]  # autogenerated, reviewed by hand

[tool.ruff.lint]
# E/F: errors · I: import order · UP: modern syntax · B: likely bugs · SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` in default arguments is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long literal expectations in tests are fine
