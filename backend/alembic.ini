# Alembic configuration (ADR-015). The database URL is NOT here: migrations/env.py reads
# DATABASE_URL from backend/.env or the environment via app.config.settings, so the
# password never lives in a committed file.
#
#   alembic upgrade head                                  # apply all migrations
#   alembic revision --autogenerate -m "add x to items"   # after changing app/db/models.py
#   alembic downgrade -1                                  # undo the last migration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
